name: Build Watch Face Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 2 -type f -name 'WatchFaceStudio.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: WatchFaceStudio.zip was not found."
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR="extracted"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            PROJECT_DIR="$(find extracted -name settings.gradle.kts -type f -print -quit | xargs -r dirname)"
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: Android project settings.gradle.kts was not found."
            find extracted -maxdepth 5 -type f | head -100
            exit 1
          fi

          cp -a "$PROJECT_DIR"/. .

          echo "Android project extracted successfully."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WatchFaceStudio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
